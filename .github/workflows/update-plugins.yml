name: Update Plugins
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure git
        run: |
          git config user.name "pi-plugins-bot"
          git config user.email "bot@pi-plugins.local"

      - name: Sync plugins to latest versions
        run: bash scripts/sync-plugins.sh

      - name: Commit and push if changed
        run: |
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync plugins to latest versions"
          # Pull rebase first to handle concurrent runs
          git pull --rebase origin main 2>/dev/null || true
          git push
