name: Update Plugins
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clean up any stale nested git repos from previous runs
        run: |
          # Remove .git dirs inside extensions/ so checkout action cleanup
          # doesn't try to process them as submodules
          find extensions -name '.git' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          # Remove any stale submodule entries from previous checkouts
          git config --local --name-only --get-regexp 'submodule\..*' 2>/dev/null | while read key; do
            git config --local --unset-all "$key" 2>/dev/null || true
          done 2>/dev/null || true
          rm -f .gitmodules 2>/dev/null || true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Configure git
        run: |
          git config user.name "pi-plugins-bot"
          git config user.email "bot@pi-plugins.local"

      - name: Sync plugins to latest versions
        run: bash scripts/sync-plugins.sh

      - name: Clean up nested git repos to prevent post-job errors
        run: |
          # Remove .git dirs inside extensions/ so checkout action cleanup
          # doesn't try to process them as submodules
          find extensions -name '.git' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          # Remove any stale submodule entries that checkout may have auto-registered
          git config --local --name-only --get-regexp 'submodule\..*' 2>/dev/null | while read key; do
            git config --local --unset-all "$key" 2>/dev/null || true
          done 2>/dev/null || true
          rm -f .gitmodules 2>/dev/null || true
      - name: Commit and push if changed
        run: |
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          if [ "$CURRENT_BRANCH" = "HEAD" ]; then
            echo "Detached HEAD state, skipping push"
            exit 0
          fi

          git commit -m "chore: sync plugins to latest versions"

          # Pull rebase first to handle concurrent runs; abort on conflict
          git pull --rebase origin "$CURRENT_BRANCH" 2>/dev/null && PULL_OK=true || PULL_OK=false
          if [ "$PULL_OK" = false ]; then
            git rebase --abort 2>/dev/null || true
          fi

          git push origin "$CURRENT_BRANCH"
